services:
  db:
    image: postgres:16-alpine
    container_name: library-db
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: library-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/library
      REDIS_URL: redis://redis:6379/0
      SEED_DATA: "1"
      RATE_LIMIT_ENABLED: "0"
    ports:
      - "8000:8000"

  redis:
    image: redis:7-alpine
    container_name: library-redis
    ports:
      - "6379:6379"

  locust:
    image: locustio/locust:2.29.0
    container_name: library-locust
    depends_on:
      - api
    working_dir: /mnt/locust
    volumes:
      - ./:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host=http://api:8000
    ports:
      - "8089:8089"

volumes:
  postgres_data:
