services:
  mongo:
    image: mongo:7
    container_name: library-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: library
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: library-api
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo_admin:password@mongo:27017
      MONGO_DB: library
      MONGO_COLLECTION: books
    ports:
      - "8000:8000"

volumes:
  mongo_data:
